<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Icon Tokens Demo</title>
        <link rel="stylesheet" href="./dist/icons-tokens.css">
        <link rel="stylesheet" href="./dist/icons.css">
        <style>
            body {
                font-family: sans-serif;
                padding: 2rem;
            }

            .example {
                margin-bottom: 1rem;
            }

            .dropdown-toggle::after {
                margin-left: 0.5rem;
            }
        </style>
</head>
<body>
        <div class="example">
            <i class="bl-icon bl-icon-chevron-down"></i>
            <span>&lt;i class="bl-icon bl-icon-chevron-down"&gt;&lt;/i&gt;</span>
        </div>

        <button class="dropdown-toggle">Dropdown</button>
</body>
</html>
