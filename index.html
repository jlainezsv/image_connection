<!DOCTYPE html>
<html lang="en" x-data="iconSearchApp()" x-init="init">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Icon Font Demo</title>

  <link rel="stylesheet" href="icons-tokens.css" />
  <link rel="stylesheet" href="icons.css" />
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .icon-count {
      font-size: 0.95rem;
      color: #666;
      font-weight: normal;
    }

    input[type="text"] {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      margin-bottom: 1.5rem;
      width: 100%;
      max-width: 400px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .icon {
      display: inline-block;
      text-align: center;
      margin: 1rem;
      cursor: pointer;
      padding: 1rem;
      background: #f5f5f5;
      border-radius: 8px;
      width: 100px;
      position: relative;
    }

    .icon i {
      font-size: 2rem;
      display: block;
      margin-bottom: 0.5rem;
    }

    .icon span {
      display: block;
      font-size: 0.9rem;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .copied-message {
      background: #4f46e5;
      color: white;
      padding: 1rem;
      border-radius: 12px;
      font-weight: bold;
      text-align: center;
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }

    .copied-message.show {
      opacity: 1;
    }

    .tooltip {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #4f46e5;
      color: white;
      font-size: 0.875rem;
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    [x-show].tooltip {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>

<body>

  <h1>
    Image Connection Icon Font
    <span class="icon-count" x-text="'(' + icons.length + ' icons)'">(0 icons)</span>
  </h1>
  <input type="text" placeholder="Buscar ícono..." x-model="search" />

  <div
    class="copied-message"
    :class="{ 'show': copiedMessage }"
    x-text="copiedMessage"
  ></div>

  <div id="icon-grid">
    <template x-for="icon in filteredIcons" :key="icon.name">
      <div class="icon group" @click="copy(icon)">
        <i :class="icon.class"></i>
        <span x-text="icon.class"></span>

        <div
          x-show="copied === icon.name"
          class="tooltip"
        >
          ¡Copiado!
        </div>
      </div>
    </template>
  </div>

  <script>
    function iconSearchApp() {
      return {
        icons: [],
        search: '',
        copied: null,
        copiedMessage: '',

        async init() {
          const res = await fetch('./icons.manifest.json');
          this.icons = await res.json();
        },

        get filteredIcons() {
          return this.icons.filter(icon =>
            icon.name.toLowerCase().includes(this.search.toLowerCase())
          );
        },

        copy(icon) {
          navigator.clipboard.writeText(icon.class);

          this.copied = icon.name;
          this.copiedMessage = `${icon.class} copiado`;

          setTimeout(() => {
            this.copied = null;
            this.copiedMessage = '';
          }, 2000);
        }
      };
    }
  </script>

</body>
</html>
